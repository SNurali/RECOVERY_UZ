version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: recovery_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: recovery_uz
      POSTGRES_USER: recovery_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-recovery_secure_pass_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - recovery_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recovery_admin -d recovery_uz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recovery_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3004
      DATABASE_URL: postgresql://recovery_admin:${DB_PASSWORD:-recovery_secure_pass_2026}@postgres:5432/recovery_uz
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_key_change_in_production}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    ports:
      - "3004:3004"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - recovery_network
    volumes:
      - ./backend/logs:/app/logs

  # Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recovery_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - recovery_network
    environment:
      VITE_API_URL: http://backend:3004/v1

networks:
  recovery_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local

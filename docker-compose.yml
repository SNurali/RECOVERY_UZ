# Production stack: postgres + backend (server.js) + nginx-served frontend.
# Same schema and code as local — only env differs.
services:
  postgres:
    image: postgres:16-alpine
    container_name: recovery_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-recovery_uz}
      POSTGRES_USER:     ${DB_USER:-recovery_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - recovery_pgdata:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    networks: [recovery_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-recovery_admin} -d ${DB_NAME:-recovery_uz}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: recovery_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3004
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER:     ${DB_USER:-recovery_admin}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME:     ${DB_NAME:-recovery_uz}
      JWT_SECRET:  ${JWT_SECRET}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID:   ${TELEGRAM_CHAT_ID}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [recovery_net]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recovery_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks: [recovery_net]

networks:
  recovery_net:
    driver: bridge

volumes:
  recovery_pgdata:
